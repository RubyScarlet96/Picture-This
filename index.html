<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<!-- add all resized images to image folder -->
<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <!-- html validator marked h4 as an error and told to change to h2 -->
      <h2>My Really Cool Blog Post</h2>
    </div>
    <!-- remove placeholder image, enter picture tag as a container.  -->
    <picture>
      <!-- enter multiple source sets so the browser chooses the appropriate image based on the device's screen size and pixels
       starting with the landscape images at 320px (320, 640, 960) put them in quotations followed by pixel density with an x -->
       <!-- i also realized I have to go from highest to lowest, so the min-width 320 will be dropped to the bottom -->
      
       <!-- start with largest 1600px with square images
        800px,1600px,2400px -->
        <source srcset="images/museum-800x800.jpg,
                       images/museum-1600x1600.jpg 2x,
                       images/museum-2400x2400.jpg 3x"
               media="(min-width:1600px)"/> 
        <!-- 1280px squared is next 
         640px, 1280px,1920px -->
         <source srcset="images/museum-640x640.jpg,
                         images/museum-1280x1280.jpg 2x,
                         images/museum-1920x1920.jpg 3x"
                media="(min-width:1280px)"/>
        <!-- add 960px
         480px, 960px, 1440px -->
         <source srcset="images/museum-480x480.jpg,
                         images/museum-960x960.jpg 2x,
                         images/museum-1440x1440.jpg 3x"
                media="(min-width:960px)"/>
        <!-- next we add in the landscape images -->
         <!-- 960px - 960, 1920,2880 -->
          <!-- *after checking the html validator i asked claude if i missed anything 
           because as a dyslexic museum as a really hard word for me to spell i got it wrong multiple times already trying to write
           it noticed the source below competes
           changing min width to 959, noticed it competes with the 960px image above -->
        <source srcset="images/museum-960x.jpg,
                       images/museum-1920x.jpg 2x,
                       images/museum-2880x.jpg 3x"
               media="(min-width:959px)"/>
        <!-- 720px - 720px, 1440px, 2160px -->
         <!-- had typo in image file line 54 caught after checking claudes analysis on my html -->
        <source srcset="images/museum-720x.jpg,
                       images/museum-1440x.jpg 2x,
                       images/museum-2160x.jpg 3x"
               media="(min-width:720px)"/>
        <!-- 480px - 480px, 960px, 1440px -->
        <source srcset="images/museum-480x.jpg,
                       images/museum-960x.jpg 2x,
                       images/museum-1440x.jpg 3x"
               media="(min-width:480px)"/>
        <!-- finally the 320px i put in earlier, but it should be at the bottom since it is the smallest -->
       <source srcset="images/museum-320x.jpg,
                       images/museum-640x.jpg 2x,
                       images/museum-960x.jpg 3x"
               media="(min-width:320px)"/>

     <!-- probably could have kept original text since we need to input img src and alt attributes at bottom 
       will not work without-->
     <img class="og-image"
          src="images/museum.jpg" 
          alt="museum" />
                       

    </picture>

  </header>
</body>
<!-- html validator caught the incomplete tag -->
</html>
